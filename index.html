<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Simu Didi 🎉</title>
  <!-- Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
      color: #ffffff;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 25px 20px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }

    .lock-icon {
      font-size: 50px;
      margin-bottom: 10px;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
      color: #f43f5e;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    label {
      display: block;
      font-size: 14px;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #ec4899;
      box-shadow: 0 0 10px rgba(236, 72, 153, 0.4);
    }

    .btn {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(45deg, #ec4899, #8b5cf6);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .error-msg {
      color: #f87171;
      font-size: 14px;
      margin-top: 10px;
      font-weight: 500;
    }

    /* Wish Section */
    #wishSection {
      display: none;
      animation: fadeIn 0.8s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .wish-title {
      font-size: 24px;
      color: #fbbf24;
      margin: 10px 0 5px 0;
      font-weight: 800;
    }

    .sub-title {
      font-size: 22px;
      color: #38bdf8;
      margin-bottom: 15px;
      font-weight: bold;
    }

    /* Popup Modal / Box for Reel */
    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #1e293b;
      padding: 15px;
      border-radius: 15px;
      max-width: 380px;
      width: 100%;
      position: relative;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .close-btn {
      color: #aaa;
      position: absolute;
      right: 15px;
      top: 10px;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }

    .close-btn:hover {
      color: #fff;
    }

    iframe {
      width: 100%;
      height: 450px;
      border: none;
      border-radius: 10px;
      margin-top: 10px;
    }

    .reel-open-btn {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Lock Screen -->
    <div id="loginSection">
      <div class="lock-icon">🎁</div>
      <div class="title">----- HAPPY BIRTHDAY -----</div>
      
      <div>
        <label for="pwdInput">Please enter your password:</label>
        <input type="password" id="pwdInput" placeholder="Enter password here">
      </div>
      
      <button class="btn" onclick="checkPassword()">Unlock Birthday Surprise 🎉</button>
      <div id="error" class="error-msg"></div>
    </div>

    <!-- Birthday Wish Screen -->
    <div id="wishSection">
      <div style="font-size: 40px;">🎂✨</div>
      <div class="wish-title">Happy wala birthday to you</div>
      <div class="sub-title">SIMU DIDI 🥳❤️</div>
      <p style="color: #cbd5e1; font-size: 14px; margin-bottom: 15px;">Aapka saal dher saari khushiyon aur kamyabi se bhara ho!</p>

      <!-- Button to Open Embedded Reel Inside Page -->
      <button class="btn reel-open-btn" onclick="openReel()">🎬 Special Birthday Reel Dekhein</button>
    </div>

  </div>

  <!-- Reel Popup Modal -->
  <div id="reelModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeReel()">&times;</span>
      <h3 style="color: #fbbf24; margin-top: 0; font-size: 18px;">Simu Didi's Special Reel 🎥</h3>
      <iframe src="https://www.instagram.com/reel/Daztln4qzlI/embed" scrolling="no" allowtransparency="true"></iframe>
    </div>
  </div>

  <script>
    function checkPassword() {
      let pwd = document.getElementById("pwdInput").value.trim();
      let errorDiv = document.getElementById("error");

      if (pwd === "890142") {
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("wishSection").style.display = "block";
        
        // Confetti effect
        confetti({
          particleCount: 120,
          spread: 80,
          origin: { y: 0.6 }
        });
      } else if (pwd === "") {
        errorDiv.innerText = "Please enter password!";
      } else {
        errorDiv.innerText = "Password sahi se dalo! (Fir se try karo)";
      }
    }

    function openReel() {
      document.getElementById("reelModal").style.display = "flex";
    }

    function closeReel() {
      document.getElementById("reelModal").style.display = "none";
      // Page reload karke iframe video ko stop karne ke liye
      let iframe = document.querySelector("iframe");
      iframe.src = iframe.src; 
    }
  </script>

</body>
</html>
